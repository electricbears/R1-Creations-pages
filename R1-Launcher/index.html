<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>R1 Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="launcher-shell">
    <header class="launcher-top">
      <button id="back-btn" class="back-button" style="display: none;" aria-label="Back to launcher">← BACK</button>
      <div id="header-content" class="header-content">
        <div class="app-title">Applications</div>
      </div>
    </header>

    <main class="launcher-main">
      <div id="selector-view" class="view active">
        <section class="card selected-target" aria-live="polite">
          <div id="target-icon" class="target-icon">TRI</div>
          <div id="target-name" class="target-name">TNG Tricorder</div>
        </section>

        <section class="card launch-grid-card">
          <div class="card-label">Launch Grid</div>
          <div id="launch-grid" class="launch-grid" role="listbox" aria-label="Launch targets"></div>
        </section>

        <section class="card launch-status" aria-live="polite">
          <div id="status-primary" class="status-primary">Ready</div>
        </section>
      </div>

      <div id="viewing-view" class="view">
        <div id="iframe-container" class="iframe-container">
          <iframe id="target-iframe" tabindex="-1" allow="camera; microphone; autoplay" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
        </div>
      </div>
    </main>

    <footer class="launcher-bottom">
      <span id="index-label">1/1</span>
      <span id="type-label">workspace</span>
    </footer>
  </div>

  <script src="js/hardware.js"></script>
  <script src="js/speak.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
