<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hulkify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="start-screen" class="start-screen">
      <div class="start-badge">HULKIFY</div>
      <div class="start-title">Gamma Camera</div>
      <div id="build-id" class="build-id"></div>
      <div id="start-text" class="start-text">Press side button or tap Start to enable the camera.</div>
      <button id="start-button" class="start-button" type="button">START CAMERA</button>
      <button id="llm-test-button" class="start-button secondary" type="button">TEST LLM (TIME)</button>
    </div>

    <video id="viewfinder" autoplay playsinline muted></video>
    <canvas id="capture-canvas" aria-hidden="true"></canvas>

    <div class="overlay top">
      <span class="badge">HULKIFY</span>
      <span id="camera-label" class="badge">BACK CAM</span>
    </div>

    <div class="overlay bottom">
      <div id="status">Starting camera...</div>
      <div class="hint">Wheel: switch cam | Side: take + Hulkify</div>
    </div>

    <div id="debug-panel" class="debug-panel">
      <div class="debug-header">DEBUG INFO</div>
      <div id="debug-content" class="debug-content"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
