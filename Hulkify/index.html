<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hulkify — Starfleet Imaging</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="start-screen" class="start-screen">
      <div class="start-badge">STARFLEET IMAGING</div>
      <div class="start-title">Gamma Camera</div>
      <div id="build-id" class="build-id"></div>
      <div id="start-text" class="start-text">Press side button or tap Engage to activate imaging array.</div>
      <button id="theme-button" class="start-button secondary" type="button">SELECT THEME</button>
      <div id="theme-current" class="theme-current">Theme: loading...</div>
      <button id="start-button" class="start-button" type="button">ENGAGE CAMERA</button>
      <button id="llm-test-button" class="start-button secondary" type="button">TEST LLM (TIME)</button>
    </div>

    <div id="theme-modal" class="theme-modal" aria-hidden="true">
      <div class="theme-modal-card" role="dialog" aria-modal="true" aria-labelledby="theme-modal-title">
        <div class="theme-modal-header">
          <div id="theme-modal-title" class="theme-modal-title">Select Photo Theme</div>
          <button id="theme-close-button" class="theme-close-button" type="button" aria-label="Close theme selector">X</button>
        </div>
        <div id="theme-list" class="theme-list"></div>
      </div>
    </div>

    <video id="viewfinder" autoplay playsinline muted></video>
    <canvas id="capture-canvas" aria-hidden="true"></canvas>

    <div class="overlay top">
      <button id="theme-badge" class="badge badge-button" type="button">STARFLEET IMAGING</button>
      <span id="camera-label" class="badge">BACK CAM</span>
    </div>

    <div class="overlay bottom">
      <div id="status">Starting camera...</div>
      <div class="hint">Wheel: switch cam | Side: capture + transform</div>
    </div>

    <div id="debug-panel" class="debug-panel">
      <div class="debug-header">DEBUG INFO</div>
      <div id="debug-content" class="debug-content"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
