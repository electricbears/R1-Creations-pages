<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical SVG Preview</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .medical-board {
      position: relative;
      width: 320px;
      height: 520px;
      border: 1px solid rgba(255, 204, 102, 0.55);
      border-radius: 4px;
      background-color: rgba(5, 8, 14, 0.92);
      overflow: hidden;
    }

    .medical-board::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(to right, rgba(255, 204, 102, 0.34) 0, rgba(255, 204, 102, 0.34) 1px, transparent 1px, transparent 14%),
        repeating-linear-gradient(to bottom, rgba(255, 204, 102, 0.30) 0, rgba(255, 204, 102, 0.30) 1px, transparent 1px, transparent 16%);
      opacity: 0.72;
    }

    .medical-figure-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .medical-figure {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .medical-outline {
      fill: rgba(182, 171, 244, 0.88);
      stroke: rgba(230, 223, 255, 0.8);
      stroke-width: 0.8;
    }

    .medical-spine,
    .medical-rib,
    .medical-organ {
      fill: none;
      stroke: rgba(255, 204, 102, 0.78);
      stroke-width: 0.65;
    }

    .medical-organ {
      stroke: rgba(234, 224, 255, 0.76);
    }
  </style>
</head>
<body>
  <div class="medical-board">
    <div class="medical-figure-wrap">
      <img class="medical-figure" src="person.svg" alt="Medical figure" aria-hidden="true" />
    </div>
  </div>
</body>
</html>
