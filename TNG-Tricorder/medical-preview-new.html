<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Silhouette Preview</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1a1a2e;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    .preview-container {
      background: #0f3460;
      border: 3px solid #00d4ff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    
    h1 {
      color: #00d4ff;
      text-align: center;
      margin: 0 0 20px 0;
      font-size: 20px;
      font-family: 'Courier New', monospace;
    }
    
    .tricorder-display {
      width: 240px;
      height: 282px;
      background: linear-gradient(135deg, #0a1f2e 0%, #0f3460 100%);
      border: 2px solid #00d4ff;
      border-radius: 4px;
      padding: 6px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .medical-view {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    .medical-board {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .medical-figure-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .medical-figure {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    
    .medical-outline {
      stroke: #00ff00;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-width: 2;
    }
    
    .medical-spine {
      stroke: #ffaa00;
      stroke-linecap: round;
      fill: none;
    }
    
    .medical-rib {
      stroke: #00aaff;
      stroke-linecap: round;
      fill: none;
    }
    
    .medical-organ {
      stroke: #ff4444;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    
    .description {
      margin-top: 30px;
      color: #00d4ff;
      font-size: 12px;
      line-height: 1.6;
      max-width: 240px;
    }
    
    .description strong {
      color: #ffff00;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>MEDICAL SCANNER</h1>
    <div class="tricorder-display">
      <div class="medical-view">
        <div class="medical-board">
          <div class="medical-figure-wrap">
            <img class="medical-figure" src="person.svg" alt="Medical figure" aria-hidden="true" />
          </div>
        </div>
      </div>
    </div>
    
    <div class="description">
      <strong>Line Figure Preview:</strong><br>
      ✓ Front view only<br>
      ✓ Clean shoulder, torso, hips, and leg lines<br>
      ✓ Uses your exact SVG geometry
    </div>
  </div>
</body>
</html>
